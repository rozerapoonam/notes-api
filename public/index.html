<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Notes</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <div>
          <p class="eyebrow">Personal Notes API</p>
          <h1>Notes</h1>
        </div>
        <p id="status" class="status" role="status"></p>
      </header>

      <section class="panel">
        <h2 id="form-title">New note</h2>
        <form id="note-form">
          <label>
            Title
            <input id="title" name="title" type="text" maxlength="200" required />
          </label>
          <label>
            Content
            <textarea id="content" name="content" rows="4" maxlength="5000"></textarea>
          </label>
          <p id="form-error" class="error" hidden></p>
          <div class="form-actions">
            <button type="submit" id="save-button">Save note</button>
            <button type="button" id="cancel-button" hidden>Cancel</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <div class="list-header">
          <h2>All notes</h2>
          <label class="search">
            Search
            <input
              id="search"
              type="search"
              placeholder="Search title or content"
            />
          </label>
        </div>
        <p id="empty" class="empty" hidden>No notes yet.</p>
        <ul id="notes" class="notes"></ul>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
